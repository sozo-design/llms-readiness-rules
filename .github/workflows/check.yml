# Checks a change to rules.json before it is merged: format, known check types, and a higher revision.
name: Check rules

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate rules.json
        run: php scripts/validate.php rules.json --published=https://sozo-design.github.io/llms-readiness-rules/rules.json
